upstream aplicaciones {
    # NGINX OSS aplica comprobaciones pasivas y aparta temporalmente instancias que fallan.
    server app-1:8000 max_fails=2 fail_timeout=10s;
    server app-2:8000 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;

    # Marca las respuestas que pasaron por el balanceador (evidencia del recorrido gateway -> balanceador -> app).
    add_header X-Balanceador "nginx" always;

    location = /health {
        proxy_pass http://aplicaciones;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location / {
        proxy_pass http://aplicaciones;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
    }
}
