upstream aplicaciones {
    # NGINX OSS aplica comprobaciones pasivas y aparta temporalmente instancias que fallan.
    server app-1:8000 max_fails=2 fail_timeout=10s;
    server app-2:8000 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;

    # Marca las respuestas que pasaron por el balanceador (evidencia del recorrido gateway -> balanceador -> app).
    add_header X-Balanceador "nginx" always;

    location = /health {
        proxy_pass http://aplicaciones;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location / {
        proxy_pass http://aplicaciones;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        # Solo se reintenta en la otra instancia si ESTA instancia falló (no conecta, no
        # responde o su proceso cae). Un 500/503 de la app suele venir de la base de datos,
        # que es compartida: reintentar no ayuda y además marcaría a las DOS instancias como
        # caídas (max_fails), botando también las lecturas. Los POST nunca se reintentan.
        proxy_next_upstream error timeout http_502 http_504;
        proxy_next_upstream_tries 2;
    }
}
